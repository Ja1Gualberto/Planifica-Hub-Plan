<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Planifica Hub — propostas A e B</title><desc id="desc">Slide comparativo: multirepo com aplicações integradas versus monorepo com aplicações separadas. Decisão em avaliação.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101827" stroke="none" stroke-width="1.5" /><rect x="64" y="44" width="5" height="20" rx="2" fill="#69DEC0" stroke="none" stroke-width="1.5" /><text x="82" y="60" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700">PLANIFICA HUB  /  ARQUITETURA</text><rect x="1330" y="38" width="206" height="36" rx="18" fill="#263044" stroke="none" stroke-width="1.5" /><text x="1350" y="62" fill="#D8C9FF" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700">EM AVALIAÇÃO</text><text x="64" y="124" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="700">Duas propostas. A mesma experiência integrada.</text><text x="64" y="170" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400">O que muda é a organização do código — não a obrigação de publicar tudo junto.</text><rect x="64" y="208" width="720" height="506" rx="20" fill="#192437" stroke="#34435A" stroke-width="1.5" /><rect x="94" y="238" width="45" height="45" rx="11" fill="#69DEC0" stroke="none" stroke-width="1.5" /><text x="107" y="270" fill="#101827" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700">A</text><text x="157" y="267" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700">Multirepo</text><text x="157" y="302" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Aplicações integradas</text><rect x="816" y="208" width="720" height="506" rx="20" fill="#192437" stroke="#34435A" stroke-width="1.5" /><rect x="846" y="238" width="45" height="45" rx="11" fill="#B9A0FF" stroke="none" stroke-width="1.5" /><text x="859" y="270" fill="#101827" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700">B</text><text x="909" y="267" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700">Monorepo</text><text x="909" y="302" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Aplicações separadas</text><line x1="424" y1="382" x2="424" y2="407" stroke="#69DEC0" stroke-width="2" /><line x1="209" y1="407" x2="639" y2="407" stroke="#69DEC0" stroke-width="2" /><line x1="209" y1="407" x2="209" y2="422" stroke="#69DEC0" stroke-width="2" /><line x1="424" y1="407" x2="424" y2="422" stroke="#69DEC0" stroke-width="2" /><line x1="639" y1="407" x2="639" y2="422" stroke="#69DEC0" stroke-width="2" /><rect x="315" y="334" width="218" height="48" rx="9" fill="#213C3D" stroke="#69DEC0" stroke-width="1.5" /><text x="343" y="365" fill="#69DEC0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700">planifica-hub</text><rect x="108" y="422" width="202" height="52" rx="9" fill="#172E33" stroke="#69DEC0" stroke-width="1.5" /><text x="132" y="455" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700">cantina</text><rect x="323" y="422" width="202" height="52" rx="9" fill="#172E33" stroke="#69DEC0" stroke-width="1.5" /><text x="347" y="455" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700">horarios</text><rect x="538" y="422" width="202" height="52" rx="9" fill="#172E33" stroke="#69DEC0" stroke-width="1.5" /><text x="562" y="455" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700">chatbot</text><text x="100" y="507" fill="#69DEC0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">4 repositórios Git · pipelines próprios</text><rect x="848" y="334" width="656" height="140" rx="12" fill="#252A43" stroke="#B9A0FF" stroke-width="1.5" /><text x="870" y="365" fill="#B9A0FF" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700">planifica/  ·  um repositório Git</text><rect x="868" y="393" width="142" height="59" rx="8" fill="#34334F" stroke="none" stroke-width="1.5" /><text x="882" y="413" fill="#C8B9EB" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400">apps/</text><text x="882" y="440" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">hub</text><rect x="1026" y="393" width="142" height="59" rx="8" fill="#34334F" stroke="none" stroke-width="1.5" /><text x="1040" y="413" fill="#C8B9EB" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400">apps/</text><text x="1040" y="440" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">cantina</text><rect x="1184" y="393" width="142" height="59" rx="8" fill="#34334F" stroke="none" stroke-width="1.5" /><text x="1198" y="413" fill="#C8B9EB" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400">apps/</text><text x="1198" y="440" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">horarios</text><rect x="1342" y="393" width="142" height="59" rx="8" fill="#34334F" stroke="none" stroke-width="1.5" /><text x="1356" y="413" fill="#C8B9EB" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400">apps/</text><text x="1356" y="440" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">chatbot</text><text x="852" y="507" fill="#B9A0FF" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">4 aplicações · pacotes compartilhados opcionais</text><line x1="100" y1="530" x2="748" y2="530" stroke="#34435A" stroke-width="2" /><text x="100" y="558" fill="#69DEC0" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700">PRINCIPAIS GANHOS</text><text x="100" y="590" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Preserva os projetos e os deploys atuais.</text><text x="100" y="620" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Permissões de código por repositório.</text><text x="100" y="653" fill="#F1C585" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700">ATENÇÃO</text><text x="100" y="678" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400">Mudanças conjuntas podem exigir vários PRs</text><text x="100" y="703" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400">e coordenação de contratos e schemas.</text><line x1="852" y1="530" x2="1500" y2="530" stroke="#34435A" stroke-width="2" /><text x="852" y="558" fill="#B9A0FF" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700">PRINCIPAIS GANHOS</text><text x="852" y="590" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Um PR pode coordenar várias aplicações.</text><text x="852" y="620" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Facilita padrões e código compartilhados.</text><text x="852" y="653" fill="#F1C585" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700">ATENÇÃO</text><text x="852" y="678" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400">Exige adaptar pipelines; o acesso ao código</text><text x="852" y="703" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400">geralmente abrange o repositório inteiro.</text><rect x="64" y="738" width="1472" height="85" rx="14" fill="#213044" stroke="none" stroke-width="1.5" /><text x="88" y="766" fill="#69DEC0" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700">NAS DUAS PROPOSTAS</text><text x="88" y="800" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">Deploys podem ser independentes. Identidade, contratos e acesso aos dados precisam ser definidos.</text><text x="64" y="858" fill="#F5F7FC" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700">Preservar a estrutura atual → A     |     Centralizar o desenvolvimento → B</text><text x="64" y="885" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400">Fonte: Panorama.canvas · Propostas em foco · B = monorepo com aplicações separadas neste comparativo.</text><text x="1489" y="883" fill="#B9C6D9" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700">01</text></svg>